[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-pilot"
version = "0.1.0"
description = "IRIS-CAND-22: one-command pilot orchestration (promote -> refresh views -> export dossiers)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
iris-pilot = "iris_pilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs PostgreSQL 16 + PostGIS 3.4 (set IRIS_TEST_DATABASE_URL)"]
